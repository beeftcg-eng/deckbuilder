name: CI

# Typecheck, lint and unit tests on every push and pull request, so a broken build shows up
# before release day rather than when build-windows.yml or deploy-pwa.yml happens to run.

on:
  push:
    branches: ["**"]
  pull_request: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npx vitest run
      # The desktop app has to open (electron/lib/smokeTest.ts): built, then started on an empty data
      # folder under a virtual display; it exits 1 if the window crashes, the page throws, a panel
      # shows "Something went wrong", or its screen doesn't appear.
      - run: npx vite build
      - name: Launch smoke test
        env:
          DECKBUILDER_SMOKE_TEST: "1"
          DECKBUILDER_DISABLE_UPDATES: "1"
        run: xvfb-run -a npx electron . --no-sandbox

  # The phone app's build, driven in Chromium at desktop and phone sizes (e2e/, playwright.config.ts):
  # importing, building, Ctrl+K, Practice, a ban list update, phone layout, and axe's WCAG 2.1 AA pass.
  # Card data and outside files are fixtures, so it never depends on the network.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
