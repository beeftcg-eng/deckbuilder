name: CI

# Typecheck, lint and unit tests on every push and pull request, so a broken build shows up
# before release day rather than when build-windows.yml or deploy-pwa.yml happens to run.

on:
  push:
    branches: ["**"]
  pull_request: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npx vitest run
