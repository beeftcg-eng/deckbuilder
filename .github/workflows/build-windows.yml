name: Build Windows installer

# electron-builder can't make the NSIS installer from Linux without Wine, so
# it's built on a real Windows runner. Run it from the Actions tab (or push a
# v* tag); the installer is attached to the run as the "Deckbuilder-Setup"
# artifact. Unsigned, so Windows SmartScreen will warn on first launch.
# To ship it (installer + Linux AppImage + update manifests) to the public
# downloads repo, run scripts/publish-release.sh once this has succeeded.

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build
      - run: npx electron-builder --win --publish never
      # The built app has to open: started on an empty data folder, it exits 1 if the window crashes,
      # the page throws, a panel shows "Something went wrong", or its screen doesn't appear
      # (electron/lib/smokeTest.ts). A failure here stops the installer from being published.
      - name: Launch smoke test
        shell: pwsh
        env:
          DECKBUILDER_SMOKE_TEST: "1"
          DECKBUILDER_DISABLE_UPDATES: "1"
        run: |
          $p = Start-Process -FilePath "release/win-unpacked/Deckbuilder.exe" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "The app didn't open (exit code $($p.ExitCode))" }
      # latest.yml is the update manifest the installed app reads (version, file hash); the
      # blockmap lets it download only what changed. Both must be published with the installer.
      - uses: actions/upload-artifact@v4
        with:
          name: Deckbuilder-Setup
          path: |
            release/Deckbuilder-Setup.exe
            release/Deckbuilder-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
