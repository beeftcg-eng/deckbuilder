name: Deploy PWA to GitHub Pages

# Builds and publishes the phone/web version of Beef's Brewhouse (vite.web.config.ts) to
# https://beeftcg-eng.github.io/deckbuilder/ - same idea as Pawmodoro's own docs/ phone app, but
# this one needs an actual build step (Vite bundling the React UI), unlike that hand-written
# vanilla-JS one, so it's a real Pages deployment via actions/deploy-pages rather than just
# committed static files. This never touches the desktop Electron build or its own release
# process (build-windows.yml, scripts/publish-release.sh) at all.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "index.html"
      - "vite.web.config.ts"
      - "public/**"
      - "package.json"
      - "scripts/build-prices.ts"
      - "scripts/missing-art.ts"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch: {}
  # Daily, so the TCGplayer price files (below) stay current even when nothing else changed.
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # TCGplayer market prices for Riftbound, Pokémon and Yu-Gi-Oh! (from tcgcsv.com), published next to
      # the app as prices/<game>.json - tcgcsv doesn't let a web page read it directly. A game that fails
      # is skipped with a warning; the apps keep the prices they already had.
      # (Bundled first: it reuses the app's own One Piece and Magic download code.)
      - run: npx rolldown scripts/build-prices.ts --platform node --format esm -o .prices/build-prices.mjs && node .prices/build-prices.mjs dist-web/prices
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The cards a Riftbound sync ends up with no picture for (scripts/missing-art.ts), on this run's
  # summary page. After the deploy, so it reads the printings file just published. Never fails the run.
  missing-art:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx rolldown scripts/missing-art.ts --platform node --format esm -o .prices/missing-art.mjs && node .prices/missing-art.mjs riftbound --markdown >> "$GITHUB_STEP_SUMMARY"
