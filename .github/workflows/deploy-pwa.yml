name: Deploy PWA to GitHub Pages

# Builds and publishes the phone/web version of Beef's Brewhouse (vite.web.config.ts) to
# https://beeftcg-eng.github.io/deckbuilder/ - same idea as Pawmodoro's own docs/ phone app, but
# this one needs an actual build step (Vite bundling the React UI), unlike that hand-written
# vanilla-JS one, so it's a real Pages deployment via actions/deploy-pages rather than just
# committed static files. This never touches the desktop Electron build or its own release
# process (build-windows.yml, scripts/publish-release.sh) at all.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "index.html"
      - "vite.web.config.ts"
      - "public/**"
      - "package.json"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
