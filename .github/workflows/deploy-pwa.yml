name: Deploy PWA to GitHub Pages

# Builds and publishes the phone/web version of Beef's Brewhouse (vite.web.config.ts) to
# https://beeftcg-eng.github.io/deckbuilder/ - same idea as Pawmodoro's own docs/ phone app, but
# this one needs an actual build step (Vite bundling the React UI), unlike that hand-written
# vanilla-JS one, so it's a real Pages deployment via actions/deploy-pages rather than just
# committed static files. This never touches the desktop Electron build or its own release
# process (build-windows.yml, scripts/publish-release.sh) at all.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "index.html"
      - "vite.web.config.ts"
      - "public/**"
      - "package.json"
      - "scripts/build-prices.ts"
      - "scripts/build-community-lists.ts"
      - "scripts/build-ban-lists.ts"
      - "scripts/check-sources.ts"
      - "scripts/health.ts"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch: {}
  # Daily, so the TCGplayer price files (below) stay current even when nothing else changed.
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  # To open (and close) an issue for each outside source that can't be read (below).
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Where each step records how its outside source did, for the source check at the end.
      HEALTH_DIR: .health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # TCGplayer market prices for Riftbound, Pokémon and Yu-Gi-Oh! (from tcgcsv.com), published next to
      # the app as prices/<game>.json - tcgcsv doesn't let a web page read it directly. A game that fails
      # is skipped with a warning; the apps keep the prices they already had.
      # (Bundled first: it reuses the app's own One Piece and Magic download code.)
      - run: npx rolldown scripts/build-prices.ts --platform node --format esm -o .prices/build-prices.mjs && node .prices/build-prices.mjs dist-web/prices
      # Community lists (src/shared/communityGames.ts): Riftbound's from RiftAtlas, One Piece's and Pokémon's
      # from Limitless, published as community/<game>.json (neither lets the phone app read it directly).
      # A game that can't be read keeps its last published file, and the source check below opens an issue.
      - name: Community lists
        continue-on-error: true
        run: npx rolldown scripts/build-community-lists.ts --platform node --format esm -o .community/build-community-lists.mjs && node .community/build-community-lists.mjs dist-web/community
      - name: Community lists - keep the last file for any game not read
        run: |
          mkdir -p dist-web/community
          for game in riftbound onepiece pokemon; do
            [ -f "dist-web/community/$game.json" ] && continue
            curl -sfL "https://beeftcg-eng.github.io/deckbuilder/community/$game.json" -o "dist-web/community/$game.json" || echo "No earlier $game file to keep."
          done
      # Ban lists (src/shared/banLists.ts): One Piece and Riftbound as kept in this repo, Yu-Gi-Oh!'s from
      # YGOPRODeck. Published as banlists.json; every app merges it in at launch. When YGOPRODeck can't be
      # read the file still goes out without Yu-Gi-Oh!, and the apps keep the list they have.
      - name: Ban lists
        continue-on-error: true
        run: npx rolldown scripts/build-ban-lists.ts --platform node --format esm -o .banlists/build-ban-lists.mjs && node .banlists/build-ban-lists.mjs dist-web
      # Every outside source the apps read, checked once a day (scripts/check-sources.ts): the steps above
      # recorded their own; this probes the card-data sources. One issue per source that can't be read,
      # closed by itself once it reads again.
      - name: Data sources
        continue-on-error: true
        run: npx rolldown scripts/check-sources.ts --platform node --format esm -o .health-check/check-sources.mjs && node .health-check/check-sources.mjs "$HEALTH_DIR"
      - name: Data sources - open or close their issues
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f "$HEALTH_DIR/report.json" ] || exit 0
          jq -c '.[]' "$HEALTH_DIR/report.json" | while read -r row; do
            source=$(jq -r .source <<<"$row")
            title="Data source can't be read: $source"
            open=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number")
            if [ "$(jq -r .ok <<<"$row")" = true ]; then
              for n in $open; do gh issue close "$n" --comment "Read again in $RUN_URL."; done
            elif [ -z "$open" ]; then
              gh issue create --title "$title" --body "The daily deploy couldn't read **$source** ($RUN_URL):

          \`\`\`
          $(jq -r .detail <<<"$row")
          \`\`\`

          The apps keep what they last had (the last published file, or the card data already downloaded). The source has probably changed or is down; check the run's log. This issue closes by itself once a deploy reads it again."
            fi
          done
          # The issue the RiftAtlas check opened before there was one per source.
          if jq -e '.[] | select(.source == "Community lists: Riftbound (RiftAtlas)" and .ok)' "$HEALTH_DIR/report.json" >/dev/null; then
            for n in $(gh issue list --state open --search "\"Community lists: RiftAtlas can't be read\" in:title" --json number --jq '.[].number'); do
              gh issue close "$n" --comment "Now checked as \"Data source can't be read: Community lists: Riftbound (RiftAtlas)\". Read again in $RUN_URL."
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
